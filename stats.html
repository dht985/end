<section class="page-hero">
  <div class="container">
    <span class="badge-era">模块三 · 数据可视化</span>
    <h1>海军装备数据看板</h1>
    <p class="sub">基于本地 data/navy-data.json，使用 ECharts 从年代、排水量、舰种构成三个维度呈现装备发展趋势。</p>
  </div>
</section>

<main class="container py-4">
  <div class="kanban-board mb-4">
    <div class="col-span-8">
      <div class="card">
        <div class="card-header"><span class="dot"></span>各年代入列装备数量</div>
        <div class="card-body p-2"><div id="chart-era" class="chart-box"></div></div>
      </div>
    </div>
    <div class="col-span-4">
      <div class="card">
        <div class="card-header"><span class="dot" style="background:var(--gold)"></span>舰种数量构成</div>
        <div class="card-body p-2"><div id="chart-pie" class="chart-box"></div></div>
      </div>
    </div>
  </div>
  <div class="card">
    <div class="card-header"><span class="dot" style="background:var(--ok)"></span>各舰种最大排水量对比（吨）</div>
    <div class="card-body p-2"><div id="chart-disp" class="chart-box tall"></div></div>
  </div>
</main>

<footer class="site-footer"><div class="container">海疆纵横 · 数据可视化模块 · 单位：艘 / 吨 · 数据来源：公开资料整理</div></footer>
