<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>三维舰船 · 海疆纵横</title>
<link rel="stylesheet" href="../css/style.css">
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; background: #0a2540; }
  .a-enter-vr, .a-orientation-modal { display: none !important; }
</style>
</head>
<body>
<div class="offline-banner">⚠️ 当前处于离线（断网）状态：A-Frame 与全部场景资源已本地化，可继续拖拽浏览。</div>

<div class="threed-cover">
  <div class="threed-topbar">
    <a href="../index.html" class="back-link">« 返回首页</a>
    <h1>三维舰船展示 · 进阶模块</h1>
    <span class="online-badge">在线</span><span class="offline-badge">离线</span>
  </div>
</div>
<div class="threed-bottombar">鼠标拖拽环视 · W/A/S/D 移动 · 场景含航母/驱逐舰/核潜艇/两栖舰等模型</div>

<a-scene vr-mode-ui="enabled: false" background="color: #b8d4e8">
  <!-- 海面 -->
  <a-plane position="0 0 0" rotation="-90 0 0" width="200" height="200" color="#2e6da4" opacity="0.85"></a-plane>
  <!-- 天空 -->
  <a-sky color="#cfe3f2"></a-sky>
  <!-- 太阳 -->
  <a-entity light="type: directional; intensity: 0.9; color: #fff8e7" position="10 20 8"></a-entity>
  <a-entity light="type: ambient; intensity: 0.45" color="#ffffff"></a-entity>

  <!-- 相机 -->
  <a-entity position="0 5 18">
    <a-camera look-controls wasd-controls></a-camera>
  </a-entity>

  <!-- 航空母舰（辽宁舰风格） -->
  <a-entity position="-10 0 0" rotation="0 -25 0">
    <!-- 飞行甲板 -->
    <a-box position="0 1.5 0" width="22" height="0.6" depth="5" color="#1a1a1a"></a-box>
    <!-- 斜角甲板 -->
    <a-box position="2 1.2 1.5" width="8" height="0.5" depth="3" color="#1a1a1a" rotation="0 -12 0"></a-box>
    <!-- 舰岛 -->
    <a-box position="-7 2.4 -1.2" width="3" height="2" depth="1.2" color="#0d3b66"></a-box>
    <a-box position="-7 3.8 -1.2" width="1.2" height="1" depth="0.8" color="#e63946"></a-box>
    <!-- 机库侧壁 -->
    <a-box position="0 0.6 0" width="22" height="1.2" depth="5" color="#0d3b66"></a-box>
    <!-- 舷号 -->
    <a-text value="16" color="#e63946" width="2" position="6 2.6 0" rotation="0 0 0"></a-text>
    <!-- 标签 -->
    <a-text value="航空母舰 · 辽宁舰" color="#0a2540" width="6" position="0 5 0" align="center"></a-text>
  </a-entity>

  <!-- 驱逐舰（055风格） -->
  <a-entity position="10 0 2" rotation="0 20 0">
    <a-box position="0 0.7 0" width="14" height="1.4" depth="2" color="#0a2540"></a-box>
    <!-- 舰首 -->
    <a-cone position="7 0.7 0" radius-bottom="1" radius-top="0.1" height="2" color="#0a2540" rotation="0 0 90"></a-cone>
    <!-- 上层建筑 -->
    <a-box position="-1 1.8 0" width="5" height="1.4" depth="1.6" color="#0d3b66"></a-box>
    <a-box position="-1 2.9 0" width="1.4" height="0.8" depth="1" color="#1f6f9e"></a-box>
    <!-- 垂发 -->
    <a-box position="3 1.5 0" width="2.5" height="0.4" depth="1.2" color="#2a9d8f"></a-box>
    <a-text value="101" color="#e63946" width="1.5" position="4 1.5 0"></a-text>
    <a-text value="驱逐舰 · 南昌舰" color="#0a2540" width="6" position="0 4.5 0" align="center"></a-text>
  </a-entity>

  <!-- 核潜艇 -->
  <a-entity position="0 0 -10" rotation="0 0 0">
    <a-cylinder position="0 0.8 0" radius="0.8" height="14" color="#0d3b66" rotation="0 0 90"></a-cylinder>
    <!-- 指挥塔围壳 -->
    <a-box position="0 1.6 0" width="2" height="1.2" depth="1.2" color="#6c5ce7"></a-box>
    <!-- 潜望镜 -->
    <a-cylinder position="0 2.6 0" radius="0.1" height="1.2" color="#0a2540"></a-cylinder>
    <a-text value="核潜艇" color="#0a2540" width="5" position="0 4 0" align="center"></a-text>
  </a-entity>

  <!-- 两栖攻击舰（075风格） -->
  <a-entity position="12 0 -8" rotation="0 -15 0">
    <a-box position="0 0.6 0" width="14" height="1.2" depth="4" color="#0d3b66"></a-box>
    <a-box position="0 1.5 0" width="14" height="0.5" depth="4" color="#1a1a1a"></a-box>
    <a-box position="-5 2.3 -1" width="2" height="1.2" depth="1.2" color="#f4a261"></a-box>
    <a-text value="两栖攻击舰" color="#0a2540" width="5" position="0 4 0" align="center"></a-text>
  </a-entity>

  <!-- 综合补给舰 -->
  <a-entity position="-12 0 -8" rotation="0 15 0">
    <a-box position="0 0.7 0" width="16" height="1.4" depth="3" color="#0a2540"></a-box>
    <a-box position="-3 1.8 0" width="4" height="1.4" depth="2" color="#7f8c8d"></a-box>
    <a-cylinder position="2 2 1.5" radius="0.2" height="1.4" color="#555"></a-cylinder>
    <a-cylinder position="2 2 -1.5" radius="0.2" height="1.4" color="#555"></a-cylinder>
    <a-text value="综合补给舰" color="#0a2540" width="5" position="0 4 0" align="center"></a-text>
  </a-entity>

  <!-- 航标/浮标装饰 -->
  <a-sphere position="-18 0.5 8" radius="0.4" color="#e63946"></a-sphere>
  <a-sphere position="18 0.5 10" radius="0.4" color="#2a9d8f"></a-sphere>
</a-scene>

<script src="libs/aframe.min.js"></script>
<script src="../js/common.js"></script>
</body>
</html>
